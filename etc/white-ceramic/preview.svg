  <text x="36" y="34" fill="#1A1A1A" font-family="Arial, sans-serif" font-size="6" text-anchor="middle">−</text>
  <rect x="49" y="20" width="28" height="18" rx="3" fill="url(#ceramic)" stroke="#B8B8B5" stroke-width=".8" filter="url(#shadow)"/>
  <text x="63" y="30.5" fill="#1A1A1A" font-family="Arial, sans-serif" font-size="4.2" text-anchor="middle">C(s)</text>
  <rect x="88" y="20" width="28" height="18" rx="3" fill="url(#ceramic)" stroke="#B8B8B5" stroke-width=".8" filter="url(#shadow)"/>
